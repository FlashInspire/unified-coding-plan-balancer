map $http_upgrade $connection_upgrade {
    websocket upgrade;
    default '';
}

server {
    server_name your-domain.example.com;
    client_max_body_size 100m;

    # ---------- Client → Nginx timeouts ----------
    # Request header + body timeout
    client_header_timeout 60s;
    client_body_timeout 60s;

    # Interval between two successful writes to the client.
    # AI streaming may have long pauses (model "thinking"), so allow 10 min.
    send_timeout 600s;

    # Idle keep-alive — default is fine
    keepalive_timeout 75s;

    listen 80;

    # ---------- Proxy → Upstream (Next.js) ----------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_redirect off;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port  443;

        # Disable proxy buffering — required for SSE streaming
        proxy_buffering off;
        proxy_cache     off;

        proxy_http_version 1.1;

        # WebSocket support — Upgrade header is only sent when the client
        # actually requests an upgrade; otherwise Connection stays empty so
        # that Nginx propagates client disconnects promptly.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Nginx → upstream timeouts
        proxy_connect_timeout 60s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }
}

